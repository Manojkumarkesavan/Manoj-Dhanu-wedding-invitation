<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhanushri &amp; Manojkumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="lock">
<div id="intro"><div class="petals"></div><p data-i18n="with"></p>
<div class="env" id="env"><div class="card"><span class="names"></span></div><div class="flap"></div></div>
<h1 class="names"></h1><p data-i18n="tag"></p><button id="open" class="btn" data-i18n="open"></button><button id="skip" class="link" data-i18n="skip"></button></div>
<header class="bar"><button id="lang" class="pill" aria-label="Language">தமிழ்</button><button id="music" class="pill" aria-label="Toggle music" data-f="musicPlayer">♪</button></header>
<main>
<section class="hero"><div class="petals"></div><p data-i18n="together"></p><h2 id="hB"></h2><span class="gold">❤️</span><h2 id="hG"></h2><p class="it" data-i18n="quote"></p><p class="gold" id="wdate"></p><p id="guest" class="guest"></p></section>
<section data-f="countdown" class="cdw"><p data-i18n="cdl"></p><div id="cd"></div></section>
<section class="rv"><h3 data-i18n="story"></h3><p data-i18n="s1"></p><p data-i18n="s2"></p></section>
<section data-f="scratchCard" class="rv"><div class="reveal" id="rev"><p data-i18n="scrWin"></p></div><canvas id="sc" aria-label="Scratch card"></canvas></section>
<section class="rv"><h3 data-i18n="events"></h3><div id="ev"></div></section>
<section id="gal" class="rv"><h3 data-i18n="gallery"></h3><div id="grid"></div></section>
<section data-f="rsvp" class="rv"><h3 data-i18n="rsvp"></h3><p data-i18n="rsvpAsk"></p>
<div class="rsvp"><input id="rn" data-ph="name" autocomplete="name"><input id="rg" type="number" min="1" value="1" aria-label="Guests"><select id="ra"><option value="y" data-i18n="yes"></option><option value="n" data-i18n="no"></option></select><textarea id="rm" data-ph="msg" rows="2"></textarea><button id="rs" class="btn" data-i18n="send"></button><small data-i18n="rsvpNote"></small></div></section>
<section class="rv"><h3 data-i18n="share"></h3><div class="row"><a id="wa" class="btn" target="_blank" rel="noopener" data-i18n="wa"></a><button id="nat" class="btn" data-i18n="nat"></button><button id="cp" class="btn" data-i18n="copy"></button></div>
<div class="row" data-f="addToCalendar"><a id="gc" class="btn" target="_blank" rel="noopener" data-i18n="gcal"></a><button id="ics" class="btn" data-i18n="ics"></button></div>
<div data-f="qrCode"><div id="qr"></div><button id="qd" class="btn" data-i18n="qrd"></button></div></section>
<section class="fin rv"><p data-i18n="f1"></p><p class="it" data-i18n="f2"></p><p data-i18n="f3"></p><h2 class="names"></h2><p class="gold" id="wdate2"></p><button id="replay" class="link" data-i18n="replay"></button></section>
</main><div id="lb" hidden><button id="lx" aria-label="Close">×</button><button id="lp" aria-label="Previous">‹</button><img alt=""><button id="ln" aria-label="Next">›</button></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="js/config.js"></script><script src="js/main.js"></script></body></html>
